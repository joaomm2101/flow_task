name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer run for the same PR/branch makes the older one obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    env:
      # Same defaults as app/test/conftest.py, set explicitly so the job never
      # depends on (or leaks) real credentials.
      SECRET_KEY: ci-secret-key-not-for-production
      DATABASE_URL: sqlite:///./test.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest app/test -ra --strict-markers --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Ruff (pyflakes, bugbear, bandit, pylint errors)
        run: uvx ruff check app --output-format github

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Audit the locked dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-emit-workspace > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --strict

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the commits of the push / pull request

      - name: Scan the new commits for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the compose files
        run: |
          printf 'POSTGRES_ADMIN_PASSWORD=x\nAPP_DB_PASSWORD=x\nSECRET_KEY=x\n' > .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q

      - name: Generate throwaway secrets
        run: |
          {
            echo "POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Build the image and start PostgreSQL + app
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build db app

      - name: Smoke test (migrations, signup, login, CRUD, headers, CSRF)
        run: scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # Single, stable check name to mark as required in branch protection,
  # regardless of how the matrix above evolves.
  ci-success:
    name: CI passed
    if: always()
    needs: [tests, lint, audit, secrets, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -E '"result": "(failure|cancelled|skipped)"'; then
            exit 1
          fi
