name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer run for the same PR/branch makes the older one obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    env:
      # Same defaults as app/test/conftest.py, set explicitly so the job never
      # depends on (or leaks) real credentials.
      SECRET_KEY: ci-secret-key-not-for-production
      DATABASE_URL: sqlite:///./test.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest app/test -ra --strict-markers --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Single, stable check name to mark as required in branch protection,
  # regardless of how the matrix above evolves.
  ci-success:
    name: CI passed
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests job result: ${{ needs.tests.result }}"
            exit 1
          fi
