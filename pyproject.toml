[project]
name = "fastapi-the-complete-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joao", email = "joaomm2101@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.13",
    "bcrypt==4.0.1",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.10",
    "pymysql>=1.2.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
fastapi-the-complete-course = "fastapi_the_complete_course:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "app",
    "venv",
]

[tool.ruff]
extend-exclude = ["app/src", "app/migrations", "venv"]

[tool.ruff.lint]
# F: pyflakes (unused/undefined names), E9: syntax errors, B: bugbear, S: bandit, PLE: pylint errors
select = ["F", "E9", "B", "S", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, share fixtures through `from .utils import *` and re-declare fixtures on purpose
"app/test/**" = ["S101", "S105", "S106", "F401", "F403", "F405", "F811"]
