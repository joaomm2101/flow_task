[project]
name = "fastapi-the-complete-course"
version = "0.1.0"
description = "Flowtask: a FastAPI to-do application"
readme = "README.md"
authors = [
    { name = "joao", email = "joaomm2101@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

# An application, not a library: nothing to build or install, only dependencies to resolve.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
# F: pyflakes (unused/undefined names), E9: syntax errors, B: bugbear, S: bandit, PLE: pylint errors
select = ["F", "E9", "B", "S", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, share fixtures through `from .utils import *` and re-declare fixtures on purpose
"app/test/**" = ["S101", "S105", "S106", "S603", "F401", "F403", "F405", "F811"]
