{% extends 'layout.html' %}
{% block title %}Editar tarefa · Flowtask{% endblock %}
{% block content %}

<section class="editor-page"><a class="back-link" href="/todos/todo-page">← Voltar para tarefas</a>
  <div class="editor-card">
    <div class="form-heading"><p class="eyebrow">EDITAR TAREFA</p><h1>Ajuste os detalhes</h1><p>Mantenha a sua lista atualizada.</p></div>
      <form id="editTodoForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-control" name="title" value="{{todo.title}}" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" class="form-control" rows="3" required>{{todo.description}}</textarea>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select name="priority" class="form-control">
            <option {% if todo.priority == 1 %} selected="selected" {% endif %}>1</option>
            <option {% if todo.priority == 2 %} selected="selected" {% endif %}>2</option>
            <option {% if todo.priority == 3 %} selected="selected" {% endif %}>3</option>
            <option {% if todo.priority == 4 %} selected="selected" {% endif %}>4</option>
            <option {% if todo.priority == 5 %} selected="selected" {% endif %}>5</option>
          </select>
        </div>
        <label class="check-field"><input type="checkbox" name="complete" {% if todo.complete %} checked {% endif %}><span>Marcar como concluída</span></label>
        <p class="form-feedback" aria-live="polite"></p>
        <div class="form-actions"><button id="deleteButton" type="button" data-busy-lock class="button button-danger">Excluir</button><span class="action-spacer"></span><a href="/todos/todo-page" class="button button-secondary">Cancelar</a><button type="submit" class="button button-primary">Salvar alterações</button></div>
      </form>
  </div>
</section>{% endblock %}
