<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#4f46e5">
  <title>{% block title %}Flowtask{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/bootstrap.css') }}"><link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}{% include 'navbar.html' %}{% endif %}
  <main class="{% if user %}app-main{% else %}auth-main{% endif %}">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='/js/base.js') }}" defer></script>
</body></html>
